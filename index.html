/* チューリップ牌が多いときは、今めくれている牌まで表示領域を自動スクロール */
document.addEventListener('animationstart',function(e){
 const tile=e.target;
 if(!tile||!tile.matches||!tile.matches('.tulipflip .t')||e.animationName!=='tflip')return;
 const box=tile.closest('.tulipflip');
 if(!box)return;
 const top=tile.offsetTop-box.offsetTop;
 const bottom=top+tile.offsetHeight;
 if(top<box.scrollTop||bottom>box.scrollTop+box.clientHeight){
  box.scrollTo({top:Math.max(0,top-box.clientHeight+tile.offsetHeight+8),behavior:'smooth'});
 }
},true);

 const handHtml=tiles(finalHand)+`<span style="width:10px"></span>${tiles([r.wt])}${r.mel.length?'<span style="width:6px"></span>'+tiles(r.mel):''}<span style="flex:1"></span>${tiles(r.nk)}`;
 return `<div class="modal"><h3>和了結果　${r.names[r.w]}の${r.ron?'ロン（'+r.names[r.from]+'）':'ツモ'}</h3>
 <div class="mh">${handHtml}</div>
 ${doraHtml}${tulipHtml}
 <div class="cols"><div><b>役</b>${rowsH}<div class="sm1">${summ}${r.hb?` 本場+${r.hb}点`:''}${r.wild?` ／白ポッチ→${r.wild}`:''}</div></div><div><b>祝儀</b>${chH}</div></div>
 ${r.dice?`<div class="dice">${r.dice}</div>`:''}
 <table class="sc"><tr><th>名前</th><th>点数増減</th><th>→合計</th><th>祝儀</th><th>→合計</th></tr>${r.names.map((n,i)=>`<tr><td>${n}</td><td class="${cls(r.chg[i])}">${r.chg[i]?fmtN(r.chg[i]):'0'}</td><td>${r.pts[i]!=null?Number(r.pts[i]).toLocaleString():'—'}点</td><td class="${cls(r.cc[i])}">${fmtN(r.cc[i],'枚')}</td><td>${r.ch[i]!=null?r.ch[i]:'—'}枚</td></tr>`).join('')}</table>
 <div class="mf"><button class="g" onclick="kifGo(-1)">結果を閉じる</button></div></div>`;
}
function kifRyuResultHtml(e){
 const tp=e.tp||[],pts=e.pts||[],chips=e.chips||[],pen=e.pen||[];
 const tpBlock=tp.length
  ?tp.map((p,i)=>`<div style="padding:2px 8px 0;font-size:10px">${KIFN[p]}（テンパイ）</div><div class="mh">${(e.tpHand&&e.tpHand[i]||[]).map(t=>kt(t)).join('')}${(e.tpMel&&e.tpMel[i]||[]).length?'<span style="width:6px"></span>'+e.tpMel[i].map(t=>kt(t)).join(''):''}</div>`).join('')
  :'<div style="padding:4px 8px;font-size:10px;opacity:.7">テンパイ者なし</div>';
 const scoreRows=KIFN.map((n,i)=>`<tr><td>${n}</td><td>${(pts[i]||0).toLocaleString()}点</td><td>${chips[i]||0}枚</td></tr>`).join('');
 const penHtml=pen.some(x=>x)?`<div style="padding:2px 8px">ノーテン罰符: ${KIFN.map((n,i)=>n+' '+(pen[i]>0?'+':'')+pen[i]).join(' ／ ')}</div>`:'';
 return `<div class="modal"><h3>流局</h3>${tpBlock}<table class="sc"><tr><th>名前</th><th>持ち点</th><th>チップ</th></tr>${scoreRows}</table>${penHtml}<div class="mf"><button class="g" onclick="kifGo(-1)">結果を閉じる</button></div></div>`;
}
function kifDraw(){
 const d=document.getElementById('kif');if(!d||!KIF)return;
 const H=KIF[KV.h],ev=H.ev,e=ev[KV.s]||ev[0],rv=kifReplayRivers(H,KV.s),sw=['東','南','西'];
 // 牌譜は常に「自分」を手前に固定する。局番号や親番では視点を回転させない。
 // 保存済み牌譜には対局時の自分の席(me)を持たせ、旧牌譜では「あなた」を優先して推定する。
 const namedMe=KIFN.findIndex(n=>String(n)==='あなた');
 const bottom=(KIFME>=0&&KIFME<3)?KIFME:(namedMe>=0?namedMe:0);
 const right=(bottom+1)%3, top=(bottom+2)%3;
 const seatPos=[top,right,bottom];
 const handHtml=p=>`<div class="krhand">${(e.hs[p]||[]).map(t=>kt(t,e.t=='d'&&e.p==p&&e.dr===t?'krhi':'')).join('')}</div>`;
 const sqRows=[top,right,bottom].map(p=>`<div class="sqr"><span>${sw[(p-H.dealer+3)%3]}</span><b>${kifReplayPoints(e,H)[p]}</b></div>`).join('');
 const wi=e.winInfo;
 const finalHtml=(e.t=='final'&&Array.isArray(e.fin))?`<div class="modal"><h3>終局結果</h3>
  <div style="padding:2px 8px;color:#ffd54a;font-weight:800">終局！</div>
  <table class="sc"><tr><th>順位</th><th>名前</th><th>最終スコア</th><th>チップ枚数</th></tr>${e.fin.map((x,i)=>`<tr><td>${i+1}位</td><td>${x[1]}</td><td>${Number(x[0]).toLocaleString()}点</td><td>${x[2]}枚</td></tr>`).join('')}</table>
  <table class="sc"><tr><th>順位</th><th>名前</th><th>今回スコア</th><th>累計スコア</th><th>累計チップ</th></tr>${e.fin.map((x,i)=>`<tr><td>${i+1}位</td><td>${x[1]}</td><td>${sg(x[3])}</td><td><b>${sg(x[4])}</b></td><td>${sg(x[5])}枚</td></tr>`).join('')}</table>
  <div class="mf"><button class="g" onclick="kifGo(-1)">結果を閉じる</button></div></div>`:' ';
 const result=(e.t=='win'&&wi)?kifResultHtml(e,wi):(e.t=='ryu'?kifRyuResultHtml(e):finalHtml);
 const actTxt=kifTxt(e);
 d.innerHTML=`<div class="felt">
 <button class="kropen" onclick="closeKif()">牌譜を閉じる</button>
 <div class="krbar"><button class="g" onclick="kifHand(-1)">◀前局</button><b>📜 ${H.label}　${KV.h+1}/${KIF.length}</b><button class="g" onclick="kifHand(1)">次局▶</button></div>
 <div class="hdr"><span class="nkp">牌譜再生・全員公開</span><span class="nkp">ドラ ${H.ind.map(x=>kt(nx(x&31))).join('')}</span></div>
 <div class="table"><div class="sq">
   <div style="font-weight:700;font-size:12px">${H.label}</div><div style="font-size:9px;opacity:.75">牌譜再生</div>${sqRows}<div class="potline">${actTxt}</div>
   <div class="cluster top">${kifReplayRiichiRod(top,e,'top',H,KV.s)}<div class="rvrow">${kifReplayRiver(top,'top',rv,e)}</div></div>
   <div class="cluster right">${kifReplayRiichiRod(right,e,'right',H,KV.s)}<div class="rvrow">${kifReplayRiver(right,'right',rv,e)}</div></div>
   <div class="cluster bottom">${kifReplayRiichiRod(bottom,e,'bottom',H,KV.s)}<div class="rvrow">${kifReplayRiver(bottom,'bottom',rv,e)}</div></div>
 </div></div>
 ${seatPos.map(p=>kifReplayPlayer(p,H,e,sw,bottom,right,top)).join('')}
 ${kifReplayMelds(H,top,'top')}
 ${kifReplayMelds(H,right,'right')}
 <div class="acts">${kifReplayMelds(H,bottom,'bottom')}</div>
 <div class="krhands top">${handHtml(top)}</div><div class="krhands right">${handHtml(right)}</div><div class="krhands bottom">${handHtml(bottom)}</div>
 ${result}
 ${e.t!='final'?`<div class="krinfo">${actTxt||'配牌'}　｜　自分・CPUとも手牌公開中</div>`:''}
 <div class="krnav"><button class="g" onclick="kifGo(-1)">◀</button><input type="range" min="0" max="${Math.max(0,ev.length-1)}" value="${KV.s}" oninput="kifSet(+this.value)"><button class="g" onclick="kifGo(1)">▶</button><span>${KV.s}/${Math.max(0,ev.length-1)}</span></div>
 </div>`;
}
/* ===== 牌譜履歴（直近5戦・ソロ/オンライン共通） ===== */
var KHIST=[],KMAX=5;
try{const a=JSON.parse(localStorage.getItem('sanmaKIF5'));if(Array.isArray(a))KHIST=a.filter(m=>m&&Array.isArray(m.hands)&&m.hands.length&&Array.isArray(m.names)&&Array.isArray(m.rank)).slice(0,KMAX)}catch(e){}
function khSave(){KHIST=KHIST.slice(0,KMAX);let ok=false;try{localStorage.setItem('sanmaKIFt','1');ok=true}catch(e){}if(!ok)return;
 let a=KHIST.slice();for(;;){try{localStorage.setItem('sanmaKIF5',JSON.stringify(a));break}catch(e){if(a.length<=1)break;a.pop()}}
 if(a.length<KHIST.length)KHIST=a}
function khAdd(m){if(KHIST.some(x=>x.id===m.id))return;KHIST.unshift(m);khSave()}
const kEsc=x=>String(x==null?'':x).slice(0,40).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kifSan(d){try{
 if(!d||typeof d!='object'||!Array.isArray(d.hands)||!d.hands.length||!Array.isArray(d.names))return null;
 const num=v=>+v||0,arr=v=>Array.isArray(v)?v:[];
 const m={id:String(d.id||'').replace(/[^\w]/g,'').slice(0,20)||('g'+Date.now().toString(36)),ts:num(d.ts)||Date.now(),mode:'guest',
  names:[0,1,2].map(i=>kEsc(d.names[i])),
  rank:arr(d.rank).slice(0,3).map(x=>[kEsc(x&&x[0]),num(x&&x[1]),num(x&&x[2]),num(x&&x[3]),num(x&&x[4]),num(x&&x[5])]),
  me:(num(d.me)>=0&&num(d.me)<3)?num(d.me):null,
  hands:d.hands.slice(0,40).map(H=>({label:kEsc(H&&H.label),dealer:((num(H&&H.dealer)%3)+3)%3,ind:arr(H&&H.ind).map(num),ura:arr(H&&H.ura).map(num),res:kEsc(H&&H.res),
   ev:arr(H&&H.ev).slice(0,800).filter(e=>e&&Array.isArray(e.hs)&&e.hs.length==3&&e.hs.every(Array.isArray)&&Array.isArray(e.ml)&&Array.isArray(e.nk))}))};
 return m.hands.every(H=>H.ev.length)?m:null}catch(e){return null}}
function kifFinish(fa){try{
 if(!G.kifAll||!G.kifAll.length)return;
 /* 牌譜の最後に、対局本編の終局画面と同じ最終スコア／チップ情報を記録する。
    最終局の牌譜イベントの末尾に置くので、再生を最後まで進めたところで表示できる。 */
 const last=G.kifAll[G.kifAll.length-1];
 if(last&&Array.isArray(last.ev)){
  last.ev=last.ev.filter(x=>x&&x.t!='final');
  last.ev.push({t:'final',fin:fa.map(x=>[x[0],x[1],x[2],x[4],x[5],x[6]]),pts:G.pts.slice(),chips:G.chips.slice(),names:G.names.slice()});
 }
 const online=!!(RM&&ROLE=='host');
 const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:Date.now(),mode:online?'host':'solo',me:V,names:G.names.slice(),
  rank:fa.map(x=>[x[1],x[0],x[2],x[4],x[5],x[6]]),hands:JSON.parse(JSON.stringify(G.kifAll))};
 khAdd(m);
 if(online)sendBig('kif',m)}catch(e){}}
const kDt=ts=>{const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`};
function openKifList(){let d=document.getElementById('kiflist');if(!d){d=document.createElement('div');d.id='kiflist';d.className='kif';d.style.zIndex=190;document.body.appendChild(d)}d.style.display='block';kifListDraw()}
function closeKifList(){const d=document.getElementById('kiflist');if(d)d.style.display='none'}
function kifListDraw(){const d=document.getElementById('kiflist');if(!d)return;
 document.querySelectorAll('.khb').forEach(b=>{b.textContent='📜 牌譜履歴('+KHIST.length+'/'+KMAX+')'});
 const md={solo:'ソロ',host:'オンライン(ホスト)',guest:'オンライン(ゲスト)'};
 d.innerHTML=`<div class="kc"><b style="font-size:15px">📜 牌譜履歴（直近${KMAX}戦）</b><span style="flex:1"></span><button class="r" onclick="closeKifList()">閉じる</button></div>`+
 (KHIST.length?KHIST.map((m,i)=>`<div class="kr"><div><b>${kDt(m.ts)}</b> ／ ${md[m.mode]||''} ／ ${m.hands.length}局</div><div style="margin:3px 0">${m.rank.map((x,k)=>`${k+1}位 ${x[0]} ${(+x[1]||0).toLocaleString()}点`).join(' ／ ')}</div><div class="kc"><button class="g" onclick="openKifAt(${i})">開く</button><button class="g" onclick="delKif(${i})">削除</button></div></div>`).join(''):'<div style="padding:12px">まだ牌譜がありません。対局が終局すると自動で保存されます（ソロ・オンライン共通で直近5戦）。</div>')}
function openKifAt(i){const m=KHIST[i];if(!m)return;KIF=m.hands;KIFN=m.names.slice();KIFME=(m.me>=0&&m.me<3)?m.me:null;openKif()}
function delKif(i){if(!KHIST[i]||!confirm('この牌譜を削除しますか？'))return;KHIST.splice(i,1);khSave();kifListDraw()}
function startGame(mode){
 const o={rep:$('orep').checked,dora:+$('odora').value,om2:$('oom2').checked,tud:$('otud').checked},hum=[1,0,0],names=[clean(NICK)||'あなた','CPU-A','CPU-B'];
 if(!RM||mode=='solo'){const n=$('nick');if(n)names[0]=clean(n.value)||'あなた';NICK=names[0]}
 SEATS={};V=0;
 if(mode=='host'&&RM){RM.prune();RM.peers().filter(p=>!p.isMe&&p.presence&&p.presence.role=='guest').slice(0,2).forEach((g,i)=>{hum[i+1]=1;names[i+1]=clean(g.presence.nick)||'ゲスト';SEATS[g.peer]=i+1});RM.emit('seat',{map:SEATS}).catch(()=>{});setTimeout(()=>{LASTM=['',''];bcast()},500)}
 G={opt:o,pts:[35000,35000,35000],dealer:0,hn:1,honba:0,pot:0,chips:[0,0,0],used:[0,0,0],hum,names,over:false};newHand()}
menu();
</script></body></html>
